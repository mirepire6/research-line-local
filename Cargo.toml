[package]
name = "research-line-local"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
getrandom = "0.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
url = "2"

[target.'cfg(windows)'.dependencies]
tao = "0.35"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57"

[profile.release]
lto = "thin"
strip = true
